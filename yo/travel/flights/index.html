<style>body {font:1.1rem/1.55 system-ui,sans-serif;color:#17382d;max-width:38rem;margin:auto;padding:1rem} a {color:#15563d} fieldset {margin:1rem 0;border:1px solid #809488} label {display:block;margin:.65rem 0} input,select,button {font:inherit;padding:.55rem;box-sizing:border-box;width:100%} button {background:#15563d;color:white;border:0;border-radius:.3rem} output {display:block;font-weight:650;margin:1rem 0}</style></head>
<body><nav><a href="/yo/awon-ise/">Àwọn irinṣẹ Yorùbá</a></nav><main>
<h1>Ṣe àfiwé owó ọkọ̀ òfuurufú</h1>
<p>Gba iye owó tikẹ́ẹ̀tì méjì fún ọ̀nà àti ọjọ́ kan náà. Tí o bá ń lọ tí o sì máa padà, fi owó ìlọ àti ìpadà sínú iye tikẹ́ẹ̀tì kọ̀ọ̀kan.</p>
<p><a href="/tools/africa-flight/" hreflang="en">Wo ìṣírò owó ìrìn àjò fún àwọn ọ̀nà ọkọ̀ òfuurufú ní Áfíríkà (ní Gẹ̀ẹ́sì)</a></p>
<form id="quotes"><label>Irú owó <select name="currency"><option>NGN</option><option>GHS</option><option>XOF</option><option>USD</option><option>GBP</option><option>EUR</option></select></label>
<label>Iye àwọn arìnrìn-àjò <input name="people" type="number" min="1" value="1" required></label>
<fieldset><legend>Tikẹ́ẹ̀tì A</legend>
<label>Iye owó tikẹ́ẹ̀tì fún ènìyàn kan <input name="fareA" type="number" step="0.01" min="0.01" required></label>
<label>Owó ẹrù àti àwọn àfikún fún ènìyàn kan <input name="extraA" type="number" step="0.01" min="0" placeholder="0"></label></fieldset><fieldset><legend>Tikẹ́ẹ̀tì B</legend>
<label>Iye owó tikẹ́ẹ̀tì fún ènìyàn kan <input name="fareB" type="number" step="0.01" min="0.01" required></label>
<label>Owó ẹrù àti àwọn àfikún fún ènìyàn kan <input name="extraB" type="number" step="0.01" min="0" placeholder="0"></label></fieldset>
<button>Ṣe àfiwé</button><output aria-live="polite"></output></form></main>
<script src="./compare.js" defer></script></body></html>
