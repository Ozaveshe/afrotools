<body>
<main>
  <nav aria-label="Ọ̀nà sí ojú ìwé"><a href="/yo/">Ilé</a> / <a href="/yo/awon-ise/">Àwọn irinṣẹ́</a></nav>
  <h1>Elo ni màá san fún pẹtiróòlù tàbí díésẹ́lì?</h1>
  <p>Yan iye owó epo tí a ròyìn ní Nàìjíríà tàbí kí o tẹ iye tí o rí ní ibùdó epo. Náírà fún lítà kan ni gbogbo iye owó.</p>
  <form id="fuel-form">
    <label for="product">Irú epo</label>
    <select id="product"><option value="petrol">Pẹtiróòlù (PMS)</option><option value="diesel">Díésẹ́lì (AGO)</option></select>
    <label for="market">Iye owó wo ni o fẹ́ lò?</label>
    <select id="market"><option value="manual">Iye owó ibùdó epo tí màá tẹ̀</option></select>
    <p id="reference" aria-live="polite">À ń gba ìròyìn iye owó. O lè tẹ iye owó ibùdó epo rẹ báyìí.</p>
    <button id="use-history" type="button" hidden>Lo iye owó àtijọ́ yìí fún ìṣírò</button>
    <label for="price">Iye owó lítà kan (₦)</label>
    <input id="price" type="number" inputmode="decimal" step="any" min="0.000001" max="10000000" required>
    <label for="litres">Lítà mélòó?</label>
    <input id="litres" type="number" inputmode="decimal" step="any" min="0.000001" max="100000" value="20" required>
    <button type="submit">Ṣírò iye tí màá san</button>
    <output id="total" for="price litres" aria-live="polite"></output>
  </form>
  <noscript><p>Láti ṣe ìṣírò fúnra rẹ, sọ iye owó lítà kan di púpọ̀ ní iye lítà tí o fẹ́ rà.</p></noscript>
