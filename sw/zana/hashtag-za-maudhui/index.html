    .cht-loading-status { text-align:center; font-size:.85rem; color:#64748b; margin-top:8px; opacity:0; transition:opacity .3s; }
    .cht-loading-status.active { opacity:1; }
    .cht-loading-dot { display:inline-block; animation:cht-dot-bounce .6s ease-in-out infinite; }
    .cht-loading-dot:nth-child(2) { animation-delay:.2s; }
    .cht-loading-dot:nth-child(3) { animation-delay:.4s; }
    .cht-consent{display:flex;align-items:flex-start;gap:9px;margin-top:12px;color:var(--cht-muted);font-size:.82rem;line-height:1.45}.cht-consent[hidden]{display:none}.cht-consent input{margin-top:3px}.cht-history-item{display:grid;width:100%;text-align:left;color:inherit}.cht-input-field[id=generationMode]{min-height:48px}.cht-tag{font-family:inherit}
    @keyframes cht-dot-bounce { 0%,100%{opacity:.3} 50%{opacity:1} }
  </style>

<meta name="geo.region" content="002"><meta property="og:locale" content="sw_KE"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Mchanganyiko wa hashtag","url":"https://afrotools.com/sw/zana/hashtag-za-maudhui/","inLanguage":"sw","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","isAccessibleForFree":true}</script><link rel="alternate" hreflang="en" href="https://afrotools.com/tools/creator-hashtags/"><link rel="alternate" hreflang="fr" href="https://afrotools.com/fr/tools/hashtags-createur/"><link rel="alternate" hreflang="sw" href="https://afrotools.com/sw/zana/hashtag-za-maudhui/"><link rel="alternate" hreflang="x-default" href="https://afrotools.com/tools/creator-hashtags/"></head>
<body class="cht-app top-level-page-ui-refresh">

  <!-- HEADER (Carousel-style) -->
  <header class="cht-app-header">
    <a href="/sw/zana/hashtag-za-maudhui/" class="cht-app-logo">
      <span>#</span> TagWave
    </a>
    <div class="cht-header-actions">
      <button type="button" class="cht-btn-icon" id="historyBtn" title="Historia">&#128197;</button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="cht-workspace">

    <!-- INPUT CARD -->
    <div class="cht-input-card">
      <label class="cht-input-label" for="topicInput">Chapisho linahusu nini?</label>
      <textarea class="cht-input-field" id="topicInput" placeholder="Behind the scenes of a Lagos wedding photoshoot..." rows="2"></textarea>

      <label class="cht-input-label" style="margin-top:16px">Jukwaa</label>
      <div class="cht-platforms" id="platformPills"></div>
      <label class="cht-input-label" for="generationMode" style="margin-top:16px">Njia ya kutengeneza</label>
      <select class="cht-input-field" id="generationMode"><option value="local">Ya ndani, ya uhakika (inapendekezwa)</option><option value="ai">Msaada wa AI wa hiari</option></select>
      <label id="aiConsentWrap" class="cht-consent" hidden><input type="checkbox" id="aiConsent"> Ninakubali kutuma mada na jukwaa nililochagua kwa AfroTools AI. Mada iliyo juu itaondoka kwenye kivinjari hiki.</label>

      <button type="button" class="cht-generate-btn" id="generateBtn" onclick="window._chtGenerate()">
        <span class="cht-spinner"></span>Tengeneza hashtag &#127991;&#65039;
      </button>
      <div class="cht-loading-status" id="loadingStatus"></div>
    </div>

    <!-- REACH LEGEND -->
    <div class="cht-legend" id="legend" style="display:none">
      <div class="cht-legend-item"><span class="cht-legend-dot high"></span>Ufikiaji mkubwa (1M+)</div>
      <div class="cht-legend-item"><span class="cht-legend-dot mid"></span>Ufikiaji wa kati (100K–1M)</div>
      <div class="cht-legend-item"><span class="cht-legend-dot niche"></span>Maalumu (&lt;100K)</div>
    </div>

    <!-- OUTPUT AREA -->
    <div class="cht-output" id="outputArea" aria-live="polite"></div>
    <div class="cht-mix-actions" id="exportActions" hidden><button type="button" class="cht-action-btn" id="downloadTxt">Pakua TXT</button><button type="button" class="cht-action-btn" id="downloadJson">Pakua JSON</button></div>

    <!-- MIX BUILDER (shown after generation) -->
    <div class="cht-mix-card" id="mixCard" style="display:none">
      <div class="cht-mix-header">
        <div class="cht-mix-title">&#128295; JENGA MCHANGANYIKO WAKO</div>
        <div class="cht-mix-count" id="mixCount">0 of 30 max</div>
      </div>
      <p style="font-size:13px;color:var(--cht-muted);margin-bottom:12px">Gusa hashtag kuongeza au kuondoa kwenye mchanganyiko</p>
      <div class="cht-mix-tags" id="mixTags">
        <span class="cht-mix-empty">Gusa hashtag zilizo juu kuanza</span>
      </div>
      <div class="cht-mix-warn" id="mixWarn">&#9888;&#65039; Umezidi idadi ya hashtag inayopendekezwa kwa jukwaa hili</div>
      <div class="cht-mix-actions">
        <button type="button" class="cht-action-btn" onclick="window._chtCopyMix()">&#128203; Nakili mchanganyiko</button>
        <button type="button" class="cht-action-btn" onclick="window._chtClearMix()">&#128465; Futa</button>
      </div>
    </div>

  </div>

  <!-- HISTORY PANEL -->
  <div id="historyPanel" class="cht-history-overlay" role="dialog" aria-modal="true" aria-labelledby="historyTitle" style="display:none">
    <div class="cht-history-panel">
      <div class="cht-history-header">
        <h3 id="historyTitle">Historia ya ndani</h3>
        <button type="button" class="cht-btn-icon" id="historyClose" aria-label="Funga historia">&times;</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="cht-toast" id="toast"></div>

<script src="/engines/creator-hashtags-engine.js?v=e9dadcff"></script>
