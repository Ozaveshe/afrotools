<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 68" fill="none" role="img" aria-label="AfroTools — Africa's Financial Platform">
  <title>AfroTools</title>
  <g id="mark">
    <polygon points="34,22 46,34 34,46 22,34" fill="#0063D1"/>
    <polygon points="34,6  42,16 34,22 26,16" fill="#F5A623"/>
    <polygon points="34,46 42,52 34,62 26,52" fill="#003F8A"/>
    <polygon points="10,26 18,34 10,42 2,34"  fill="#338FFF" opacity="0.9"/>
    <polygon points="58,26 66,34 58,42 50,34" fill="#004DB3" opacity="0.9"/>
    <line x1="34" y1="22" x2="34" y2="46" stroke="#F5A623" stroke-width="0.8" opacity="0.35"/>
    <line x1="22" y1="34" x2="46" y2="34" stroke="#F5A623" stroke-width="0.8" opacity="0.35"/>
  </g>
  <!-- textLength pins the wordmark geometry: an <img>-embedded SVG never loads a
       webfont, so the intended condensed face is always a fallback. -->
  <g id="wordmark" font-family="'Barlow Condensed','Arial Narrow',system-ui,sans-serif">
    <text x="82" y="44" font-size="34" font-weight="800" fill="#0a0f1a" textLength="80" lengthAdjust="spacingAndGlyphs">AFRO</text>
    <text x="166" y="44" font-size="34" font-weight="800" fill="#0063D1" textLength="102" lengthAdjust="spacingAndGlyphs">TOOLS</text>
    <text x="83" y="58" font-size="7.5" font-weight="400" fill="#5A7A9E" textLength="184" lengthAdjust="spacingAndGlyphs">AFRICA'S FINANCIAL PLATFORM</text>
  </g>
</svg>
