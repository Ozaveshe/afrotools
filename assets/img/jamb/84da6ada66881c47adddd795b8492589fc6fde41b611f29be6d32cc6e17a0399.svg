<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 290" role="img" aria-labelledby="title desc">
<title id="title">Right triangle with an altitude</title>
<desc id="desc">Triangle XYZ is right-angled at Y. T lies on XZ and YT is perpendicular to XZ. XT equals 9 cm and TZ equals 16 cm.</desc>
<rect width="390" height="290" fill="#fff"/>
<path d="M 40 240 L 148 96 L 340 240 Z M 148 96 L 148 240" fill="none" stroke="#172b26" stroke-width="3"/><path d="M 148 225 L 163 225 L 163 240 M 140.8 105.6 L 150.4 112.8 L 157.6 103.2" fill="none" stroke="#172b26" stroke-width="2"/><g fill="#172b26" font-family="Arial, sans-serif" font-size="19" text-anchor="middle"><text x="25" y="245">X</text><text x="148" y="79">Y</text><text x="359" y="245">Z</text><text x="148" y="266">T</text><text x="94" y="229">9 cm</text><text x="244" y="229">16 cm</text></g>
</svg>
