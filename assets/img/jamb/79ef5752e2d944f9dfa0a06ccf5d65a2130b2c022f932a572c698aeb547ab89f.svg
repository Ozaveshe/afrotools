<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" role="img" aria-labelledby="title description">
  <title id="title">Triangle XYZ with perpendicular height XK</title>
  <desc id="description">Y, K and Z lie in that order on a horizontal straight line. X is above K. XK is perpendicular to YZ. XK is 15 centimetres, XZ is 25 centimetres, and YK is 8 centimetres.</desc>
  <rect width="380" height="260" fill="#ffffff"/>
  <g fill="none" stroke="#172536" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 50 210 L 130 60 L 330 210 Z"/>
    <path d="M 130 60 L 130 210"/>
    <path d="M 130 198 L 142 198 L 142 210"/>
  </g>
  <g fill="#172536" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <text x="130" y="43">X</text>
    <text x="39" y="231">Y</text>
    <text x="130" y="236">K</text>
    <text x="340" y="231">Z</text>
    <text x="109" y="147">15</text>
    <text x="245" y="132">25</text>
    <text x="87" y="202">8</text>
  </g>
  <text x="190" y="256" fill="#475569" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Lengths in centimetres</text>
</svg>
