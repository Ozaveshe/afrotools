<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="title desc">
<title id="title">Prism with trapezium PQRS as its uniform cross-section</title>
<desc id="desc">PQ and RS are parallel, measuring 6 m and 11 m. QR is perpendicular to them and measures 12 m. The prism extends 8 m perpendicular to this cross-section.</desc>
<rect width="440" height="400" fill="#fff"/>
<g stroke="#172b26" stroke-width="2.5" stroke-linejoin="round">
<path d="M 50 232 L 230 42 L 370 42 L 190 232 Z" fill="#e2e8f0"/>
<path d="M 50 232 L 190 232 L 190 340 L 50 340 Z" fill="#f8fafc"/>
<path d="M 190 232 L 190 340 L 370 240 L 370 42 Z" fill="#eef5f1"/>
<path d="M 190 324 L 204 316.222222 L 204 332.222222 M 356 247.777778 L 356 231.777778 L 370 224" fill="none" stroke-width="1.5"/>
</g>
<g fill="#172b26" font-family="Arial, sans-serif" font-size="19">
<text x="192" y="222">P</text><text x="177" y="366">Q</text><text x="377" y="251">R</text><text x="377" y="45">S</text>
<text x="5" y="290">6 m</text><text x="104" y="369">8 m</text><text x="276" y="314">12 m</text><text x="382" y="150">11 m</text>
</g>
</svg>
