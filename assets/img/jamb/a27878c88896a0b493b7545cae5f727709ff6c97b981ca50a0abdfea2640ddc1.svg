<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" role="img" aria-labelledby="title desc">
<title id="title">Trapezium PQRS</title><desc id="desc">P and S are the endpoints of the lower base, Q and R the upper base. Matching arrow marks show QR is parallel to PS.</desc>
<rect width="460" height="330" fill="white"/>
<g fill="none" stroke="#172f2b" stroke-width="3" stroke-linejoin="round"><path d="M70 270 L170 65 L270 65 L370 270 Z"/><path d="M219 59 L229 65 L219 71 M219 264 L229 270 L219 276"/></g>
<g fill="#172f2b" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><text x="61" y="300">P</text><text x="161" y="47">Q</text><text x="281" y="47">R</text><text x="381" y="300">S</text></g>
</svg>
