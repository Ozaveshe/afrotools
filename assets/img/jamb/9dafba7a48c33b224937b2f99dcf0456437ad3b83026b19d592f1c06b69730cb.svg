<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-labelledby="title desc">
<title id="title">Triangle XYZ</title>
<desc id="desc">Triangle XYZ has XY equal to 4, XZ equal to 3 and YZ equal to 6.</desc>
<rect width="400" height="290" fill="#fff"/>
<path d="M 40 220 L 219.166666667 131.12196246791024 L 340 220 Z" fill="#f1f5f9" stroke="#172b26" stroke-width="3" stroke-linejoin="round"/>
<g fill="#172b26" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">
<text x="219" y="110">X</text><text x="25" y="226">Y</text><text x="361" y="226">Z</text>
<text x="118" y="163">4</text><text x="292" y="160">3</text><text x="190" y="250">6</text>
</g>
</svg>
