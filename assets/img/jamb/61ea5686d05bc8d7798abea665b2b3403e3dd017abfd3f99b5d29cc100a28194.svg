<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title description">
<title id="title">Minor circular segment</title>
<desc id="description">A circle has two radii of length 3 meeting at its centre at an angle of 120 degrees. A chord joins their endpoints. The shaded minor segment is between the chord and the shorter arc.</desc>
<rect width="360" height="330" fill="#ffffff"/>
<path d="M 76.07695154586737 119.99999999999999 A 120 120 0 0 1 283.92304845413264 119.99999999999994 Z" fill="#dce7f1"/>
<g fill="none" stroke="#172536" stroke-width="2.5" stroke-linejoin="round">
<circle cx="180" cy="180" r="120"/>
<path d="M 76.07695154586737 119.99999999999999 L 283.92304845413264 119.99999999999994 M 76.07695154586737 119.99999999999999 L 180 180 L 283.92304845413264 119.99999999999994"/>
<path d="M 157.483 167 A 26 26 0 0 1 202.517 167"/>
</g><circle cx="180" cy="180" r="3" fill="#172536"/>
<g fill="#172536" font-family="Arial, sans-serif" font-size="20" text-anchor="middle"><text x="126" y="165">3</text><text x="235" y="165">3</text><text x="180" y="171" font-size="16">120°</text><text x="180" y="102" font-size="15">Shaded segment</text></g>
<text x="180" y="324" fill="#475569" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Lengths in units</text>
</svg>
