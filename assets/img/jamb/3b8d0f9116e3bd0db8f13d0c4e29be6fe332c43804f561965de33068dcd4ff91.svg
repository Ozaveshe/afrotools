<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 325" role="img" aria-labelledby="title desc">
<title id="title">Similar triangles and a trapezium</title>
<desc id="desc">Q lies on PT and R lies on PS. QR is parallel to TS. QR:TS equals 2:3.</desc>
<rect width="390" height="325" fill="#fff"/>
<path d="M 245 40 L 40 280 L 350 280 Z" fill="#f1f5f9" stroke="#172b26" stroke-width="3"/><path d="M 108.333333333 200 L 315 200" fill="none" stroke="#172b26" stroke-width="3"/><path d="M 202 194 L 210 200 L 202 206 M 202 274 L 210 280 L 202 286" fill="none" stroke="#172b26" stroke-width="2"/><g fill="#172b26" font-family="Arial, sans-serif" font-size="19" text-anchor="middle"><text x="245" y="25">P</text><text x="88" y="203">Q</text><text x="332" y="203">R</text><text x="23" y="287">T</text><text x="366" y="287">S</text><text x="195" y="317">QR : TS = 2 : 3</text></g>
</svg>
