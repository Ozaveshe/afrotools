<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-labelledby="title description">
<title id="title">Cube GHIJKLMN with segment HN</title>
<desc id="description">GHIJ and KLMN are parallel square faces of a cube. The connecting edges are GK, HL, IM and JN. Every edge has length a. The dashed segment HN joins H to N.</desc>
<rect width="380" height="330" fill="#ffffff"/>
<g fill="none" stroke="#172536" stroke-width="2.5" stroke-linejoin="round"><line x1="50" y1="250" x2="230" y2="270"/><line x1="230" y1="270" x2="320" y2="190"/><line x1="320" y1="190" x2="140" y2="170" stroke-dasharray="7 5"/><line x1="140" y1="170" x2="50" y2="250" stroke-dasharray="7 5"/><line x1="50" y1="110" x2="230" y2="130"/><line x1="230" y1="130" x2="320" y2="50"/><line x1="320" y1="50" x2="140" y2="30"/><line x1="140" y1="30" x2="50" y2="110"/><line x1="50" y1="250" x2="50" y2="110"/><line x1="230" y1="270" x2="230" y2="130"/><line x1="320" y1="190" x2="320" y2="50"/><line x1="140" y1="170" x2="140" y2="30" stroke-dasharray="7 5"/></g>
<g fill="none" stroke="#175f91" stroke-width="2.5"><line x1="230" y1="270" x2="140" y2="30" stroke-dasharray="7 5"/></g>
<g fill="#172536" font-family="Arial, sans-serif" font-size="20" text-anchor="middle"><text x="37" y="269">G</text><text x="230" y="294">H</text><text x="337" y="197">I</text><text x="155" y="173">J</text><text x="37" y="108">K</text><text x="244" y="129">L</text><text x="335" y="52">M</text><text x="140" y="17">N</text><text x="139" y="286">a</text></g>
<text x="190" y="322" fill="#475569" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Schematic cube; every edge has length a</text>
</svg>
