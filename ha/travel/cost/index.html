<!doctype html>
<html lang="ha">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lissafin kuɗin tafiya | AfroTools</title>
  <meta name="description" content="Haɗa kuɗin sufuri, masauki da abinci domin tsara kasafin tafiya ga mutum ɗaya ko rukuni.">
  <link rel="canonical" href="https://afrotools.com/ha/travel/cost/">
  <style>
    body {font: 1.05rem/1.55 system-ui,sans-serif;color:#17382d;max-width:38rem;margin:auto;padding:1rem}
    label {display:block;margin:.8rem 0} input,select,button {font:inherit;padding:.5rem;box-sizing:border-box;width:100%}
    button {background:#15563d;color:white;border:0;border-radius:.3rem;cursor:pointer} a {color:#15563d}
    output {display:block;font-weight:700;margin:1rem 0} fieldset {margin:1rem 0;border:1px solid #8a9b92}
  </style>
</head>
<body>
  <nav><a href="/ha/">AfroTools · Shafin farko</a></nav>
  <main>
    <h1>Lissafin kuɗin tafiya</h1>
    <p>Shigar da farashin da ka samu domin ganin jimillar kuɗin tafiya da rabon kowane matafiyi. Ka yi amfani da kuɗi iri ɗaya a duk filayen.</p>
    <form id="budget">
      <label>Nau’in kuɗi <select name="currency"><option>NGN</option><option>XOF</option><option>XAF</option><option>GHS</option><option>USD</option><option>EUR</option></select></label>
      <label>Mutane nawa za su tafi? <input name="people" type="number" min="1" value="1" required></label>
      <label>Kwanakin tafiya <input name="days" type="number" min="1" value="1" required></label>
      <fieldset><legend>Kuɗin kowane matafiyi</legend>
        <label>Sufuri na zuwa da dawowa <input name="transport" type="number" min="0" step="0.01" placeholder="0"></label>
        <label>Abinci da sauran kashe kuɗi a rana <input name="daily" type="number" min="0" step="0.01" placeholder="0"></label>
      </fieldset>
      <fieldset><legend>Kuɗin masaukin rukuni</legend>
        <label>Kuɗin masauki a dare ɗaya ga dukan rukuni <input name="stay" type="number" min="0" step="0.01" placeholder="0"></label>
        <label>Dare nawa? <input name="nights" type="number" min="0" value="0" required></label>
      </fieldset>
      <button>Lissafta kuɗin tafiya</button>
      <output aria-live="polite"></output>
    </form>
  </main>
  <script src="./budget.js" defer></script>
</body>
</html>
