<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Baby cost planner | AfroTools</title>
  <meta name="description" content="Budget for one-time purchases and recurring costs over the number of months you choose. Use your local prices.">
  <link rel="canonical" href="https://afrotools.com/tools/baby-cost/">
  <link rel="stylesheet" href="/assets/css/household-planning.css">
</head>
<body><main>
<nav><a href="/">AfroTools</a> / <a href="/categories/">Tool categories</a></nav>
<h1>Baby cost planner</h1>
<p>Budget for one-time purchases and recurring costs over the number of months you choose. Use your local prices.</p>
<form data-plan="baby-cost">
  <p>Enter all amounts in the same currency.</p>
  <label>One-time purchases and preparation<input type="number" name="setup" min="0" step="any" inputmode="decimal" required></label>
  <label>Monthly supplies, feeding, transport and care<input type="number" name="monthly" min="0" step="any" inputmode="decimal" required></label>
  <label>Months to budget for<input type="number" name="months" min="1" step="1" inputmode="decimal" value="12" required></label>
  <label>Money already set aside<input type="number" name="saved" min="0" step="any" inputmode="decimal" value="0" required></label>
  <button type="submit">Calculate</button>
  <section hidden aria-live="polite"><h2>Your estimate</h2>
    <p>Recurring costs for the period: <output name="recurring"></output></p>
    <p>Total planned cost: <output name="total"></output></p>
    <p>Still to fund: <output name="gap"></output></p>
  </section>
</form>
</main>
<script src="/assets/js/pages/household-planning.js" defer></script>
</body></html>
