<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Annual financial review | AfroTools</title>
  <meta name="description" content="Review your income and spending and see how your net worth changed. Enter values for the same twelve months.">
  <link rel="canonical" href="https://afrotools.com/tools/annual-financial-review/">
  <link rel="stylesheet" href="/assets/css/household-planning.css">
</head>
<body><main>
<nav><a href="/">AfroTools</a> / <a href="/categories/">Tool categories</a></nav>
<h1>Annual financial review</h1>
<p>Review your income and spending and see how your net worth changed. Enter values for the same twelve months.</p>
<form data-plan="annual-financial-review">
  <p>Enter all amounts in the same currency.</p>
  <label>Income received during the year<input type="number" name="income" min="0" step="any" inputmode="decimal" required></label>
  <label>Spending during the year<input type="number" name="expenses" min="0" step="any" inputmode="decimal" required></label>
  <label>Assets at the start of the year<input type="number" name="startAssets" min="0" step="any" inputmode="decimal" required></label>
  <label>Debts at the start of the year<input type="number" name="startDebt" min="0" step="any" inputmode="decimal" required></label>
  <label>Assets at the end of the year<input type="number" name="endAssets" min="0" step="any" inputmode="decimal" required></label>
  <label>Debts at the end of the year<input type="number" name="endDebt" min="0" step="any" inputmode="decimal" required></label>
  <button type="submit">Calculate</button>
  <section hidden aria-live="polite"><h2>Your estimate</h2>
    <p>Income less spending: <output name="balance"></output></p>
    <p>Closing net worth: <output name="worth"></output></p>
    <p>Change in net worth over the year: <output name="change"></output></p>
  </section>
</form>
</main>
<script src="/assets/js/pages/household-planning.js" defer></script>
</body></html>
