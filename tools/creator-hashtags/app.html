    .cht-loading-status { text-align:center; font-size:.85rem; color:#64748b; margin-top:8px; opacity:0; transition:opacity .3s; }
    .cht-loading-status.active { opacity:1; }
    .cht-loading-dot { display:inline-block; animation:cht-dot-bounce .6s ease-in-out infinite; }
    .cht-loading-dot:nth-child(2) { animation-delay:.2s; }
    .cht-loading-dot:nth-child(3) { animation-delay:.4s; }
    .cht-consent{display:flex;align-items:flex-start;gap:9px;margin-top:12px;color:var(--cht-muted);font-size:.82rem;line-height:1.45}.cht-consent[hidden]{display:none}.cht-consent input{margin-top:3px}.cht-history-item{display:grid;width:100%;text-align:left;color:inherit}.cht-input-field[id=generationMode]{min-height:48px}.cht-tag{font-family:inherit}

<body class="cht-app top-level-page-ui-refresh">

  <!-- HEADER (Carousel-style) -->
  <header class="cht-app-header">
    <a href="index.html" class="cht-app-logo">
      <span>#</span> TagWave
    </a>
    <div class="cht-header-actions">
      <button type="button" class="cht-btn-icon" id="historyBtn" title="History">&#128197;</button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="cht-workspace">

    <!-- INPUT CARD -->
    <div class="cht-input-card">
      <label class="cht-input-label" for="topicInput">What's the post about?</label>
      <textarea class="cht-input-field" id="topicInput" placeholder="Behind the scenes of a Lagos wedding photoshoot..." rows="2"></textarea>

      <label class="cht-input-label" style="margin-top:16px">Platform</label>
      <div class="cht-platforms" id="platformPills"></div>
      <label class="cht-input-label" for="generationMode" style="margin-top:16px">Generation mode</label>
      <select class="cht-input-field" id="generationMode"><option value="local">Local, deterministic (recommended)</option><option value="ai">Optional AI assist</option></select>
      <label id="aiConsentWrap" class="cht-consent" hidden><input type="checkbox" id="aiConsent"> I agree to send the topic and selected platform to AfroTools AI. The exact topic above will leave this browser.</label>

      <button type="button" class="cht-generate-btn" id="generateBtn" onclick="window._chtGenerate()">
        <span class="cht-spinner"></span>Generate Tags &#127991;&#65039;
      </button>
      <div class="cht-loading-status" id="loadingStatus"></div>
    </div>

    <!-- REACH LEGEND -->
    <div class="cht-legend" id="legend" style="display:none">
      <div class="cht-legend-item"><span class="cht-legend-dot high"></span>High Reach (1M+)</div>
      <div class="cht-legend-item"><span class="cht-legend-dot mid"></span>Mid Reach (100K–1M)</div>
      <div class="cht-legend-item"><span class="cht-legend-dot niche"></span>Niche (&lt;100K)</div>
    </div>

    <!-- OUTPUT AREA -->
    <div class="cht-output" id="outputArea" aria-live="polite"></div>
    <div class="cht-mix-actions" id="exportActions" hidden><button type="button" class="cht-action-btn" id="downloadTxt">Download TXT</button><button type="button" class="cht-action-btn" id="downloadJson">Download JSON</button></div>

    <!-- MIX BUILDER (shown after generation) -->
    <div class="cht-mix-card" id="mixCard" style="display:none">
      <div class="cht-mix-header">
        <div class="cht-mix-title">&#128295; BUILD YOUR OWN MIX</div>
        <div class="cht-mix-count" id="mixCount">0 of 30 max</div>
      </div>
      <p style="font-size:13px;color:var(--cht-muted);margin-bottom:12px">Tap tags above to add/remove from your mix</p>
      <div class="cht-mix-tags" id="mixTags">
        <span class="cht-mix-empty">Tap tags above to start building</span>
      </div>
      <div class="cht-mix-warn" id="mixWarn">&#9888;&#65039; You've exceeded the recommended tag count for this platform</div>
      <div class="cht-mix-actions">
        <button type="button" class="cht-action-btn" onclick="window._chtCopyMix()">&#128203; Copy Mix</button>
        <button type="button" class="cht-action-btn" onclick="window._chtClearMix()">&#128465; Clear</button>
      </div>
    </div>

  </div>

  <!-- HISTORY PANEL -->
  <div id="historyPanel" class="cht-history-overlay" role="dialog" aria-modal="true" aria-labelledby="historyTitle" style="display:none">
    <div class="cht-history-panel">
      <div class="cht-history-header">
        <h3 id="historyTitle">Local history</h3>
        <button type="button" class="cht-btn-icon" id="historyClose" aria-label="Close history">&times;</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="cht-toast" id="toast"></div>

<script src="/engines/creator-hashtags-engine.js?v=e9dadcff"></script>
