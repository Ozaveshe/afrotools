<body class="top-level-page-ui-refresh" data-local-first-downloads>
<header class="bp-topbar">
  <a class="bp-back" href="index.html">Back</a>
  <a class="bp-brand" href="index.html">Business Plan Builder</a>
  <span class="bp-title" id="planTitle">Untitled plan</span>
  <button class="bp-btn" id="copyBriefBtn" type="button">Copy Brief</button>
  <button class="bp-btn" id="savePlanBtn" type="button">Save</button>
  <button class="bp-btn primary" id="pdfBtn" type="button">Download PDF</button>
</header>

<main class="bp-app" aria-label="Business plan builder workspace">
  <section class="bp-left">
    <div class="bp-saved" id="savedPanel" hidden>
      <div class="bp-panel-head">
        <div>
          <span class="bp-eyebrow">Saved locally</span>
          <h2>Business plans</h2>
        </div>
      </div>
      <div class="bp-saved-grid" id="savedPlans"></div>
    </div>

    <section class="bp-panel">
      <div class="bp-panel-head">
        <div>
          <span class="bp-eyebrow">Setup</span>
          <h1>Plan workspace</h1>
        </div>
        <span class="bp-sync" id="draftStatus">Draft ready</span>
      </div>
      <div class="bp-grid four">
        <label>Plan format
          <select id="planFormat" data-bind="meta.format">
            <option value="lender">Lender-ready plan</option>
            <option value="investor">Investor plan</option>
            <option value="lean">Lean one-page plan</option>
            <option value="grant">Grant or NGO plan</option>
            <option value="internal">Internal growth plan</option>
          </select>
        </label>
        <label>Country
          <select id="country" data-bind="meta.country">
            <option value="Nigeria">Nigeria</option>
            <option value="Kenya">Kenya</option>
            <option value="Ghana">Ghana</option>
            <option value="South Africa">South Africa</option>
            <option value="Tanzania">Tanzania</option>
            <option value="Uganda">Uganda</option>
            <option value="Rwanda">Rwanda</option>
            <option value="Ethiopia">Ethiopia</option>
            <option value="Egypt">Egypt</option>
            <option value="Morocco">Morocco</option>
            <option value="Senegal">Senegal</option>
            <option value="Cameroon">Cameroon</option>
            <option value="Pan-African">Pan-African</option>
          </select>
        </label>
        <label>Currency
          <select id="currency" data-bind="meta.currency">
            <option value="NGN">NGN</option>
            <option value="KES">KES</option>
            <option value="GHS">GHS</option>
            <option value="ZAR">ZAR</option>
            <option value="TZS">TZS</option>
            <option value="UGX">UGX</option>
            <option value="RWF">RWF</option>
            <option value="ETB">ETB</option>
            <option value="EGP">EGP</option>
            <option value="MAD">MAD</option>
            <option value="XOF">XOF</option>
            <option value="XAF">XAF</option>
            <option value="USD">USD</option>
          </select>
        </label>
        <label>Forecast
          <select id="forecastYears" data-bind="meta.forecastYears">
            <option value="3">3 years</option>
            <option value="5">5 years</option>
          </select>
        </label>
      </div>
      <div class="bp-template-row" id="templateRow" aria-label="Industry templates"></div>
    </section>

    <nav class="bp-section-nav" id="sectionNav" aria-label="Business plan sections"></nav>

    <section class="bp-panel bp-editor">
      <div class="bp-panel-head">
        <div>
          <span class="bp-eyebrow" id="sectionKicker">Section</span>
          <h2 id="sectionTitle">Business plan</h2>
        </div>
        <div class="bp-mini-actions">
          <button class="bp-btn" id="prevSectionBtn" type="button">Previous</button>
          <button class="bp-btn primary" id="nextSectionBtn" type="button">Next</button>
        </div>
      </div>
      <p class="bp-help" id="sectionHelp"></p>
      <div id="sectionBody"></div>
    </section>
  </section>

  <aside class="bp-right" aria-label="Plan preview and export">
    <section class="bp-export">
      <button class="bp-export-btn primary" id="savePlanSideBtn" type="button">Save</button>
      <button class="bp-export-btn" id="docBtn" type="button">DOC</button>
      <button class="bp-export-btn" id="txtBtn" type="button">TXT</button>
      <button class="bp-export-btn" id="csvBtn" type="button">CSV</button>
      <button class="bp-export-btn" id="jsonBtn" type="button">JSON</button>
      <label class="bp-export-btn file-label" for="importJson">Import</label>
      <input id="importJson" class="bp-file-input" type="file" accept="application/json,.json">
      <label class="bp-export-review" for="bpExportReview">
        <input id="bpExportReview" type="checkbox">
        <span>I reviewed the company, market evidence, offer, operations, milestones, forecast assumptions, funding, risks, and final plan preview.</span>
        <span class="bp-export-status" id="bpExportStatus" role="status" aria-live="polite">Complete and review the plan before download or copied handoff.</span>
      </label>
    </section>

    <section class="bp-review">
      <div class="bp-score-row">
        <div>
          <span class="bp-eyebrow">Plan readiness</span>
          <h2><span id="scoreValue">0</span>/100</h2>
        </div>
        <span id="scoreLabel" class="bp-score-label">Draft</span>
      </div>
      <div class="bp-meter"><span id="scoreMeter"></span></div>
      <div class="bp-checks" id="checkList"></div>
    </section>

    <section class="bp-metrics">
      <dl>
        <div><dt>Year 1 revenue</dt><dd id="metricRevenue">0</dd></div>
        <div><dt>Year 1 profit</dt><dd id="metricProfit">0</dd></div>
        <div><dt>Gross margin</dt><dd id="metricMargin">0%</dd></div>
        <div><dt>Funding gap</dt><dd id="metricFunding">0</dd></div>
      </dl>
    </section>

    <section class="bp-preview-card">
      <div class="bp-preview-head">
        <span class="bp-eyebrow">Live preview</span>
        <button class="bp-btn" id="onePageBtn" type="button">One-page brief</button>
      </div>
      <article class="bp-preview" id="planPreview" tabindex="0"></article>
    </section>
  </aside>
</main>
<script>
(function(){
  var review=document.getElementById('bpExportReview');
  var status=document.getElementById('bpExportStatus');
  var exportIds=['pdfBtn','docBtn','txtBtn','csvBtn','jsonBtn','copyBriefBtn'];
  function exportProblem(id){
    if(id==='jsonBtn')return '';
    var name=document.querySelector('[data-section-field="company.name"]');
    var storedName=name?name.value:String((document.getElementById('planTitle')||{}).textContent||'').replace(/Untitled plan/i,'').trim();
    if(!storedName)return 'Add a business name before this export.';
    if(id==='csvBtn'){
      var revenue=[].slice.call(document.querySelectorAll('[data-fin-row="revenue"]')).some(function(input){return Number(input.value)>0});
      var metric=String((document.getElementById('metricRevenue')||{}).textContent||'');
      if(!revenue&&!/[1-9]/.test(metric))return 'Add at least one positive revenue forecast before exporting CSV.';
    }
    var preview=String((document.getElementById('planPreview')||{}).textContent||'').trim();
    if(preview.length<240)return 'Add enough company, market, offer, and operating detail before this handoff.';
    return '';
  }
  function requireReview(event){
    var button=event.target&&event.target.closest&&event.target.closest('button');
    if(!button)return;
    var id=button.id;
    if(id==='nextSectionBtn'&&/Export PDF/i.test(button.textContent))id='pdfBtn';
    if(exportIds.indexOf(id)===-1)return;
    var problem=exportProblem(id);
    if(problem){
      event.preventDefault();
      event.stopImmediatePropagation();
      if(status)status.textContent=problem;
      var target=document.querySelector('[data-section-field="company.name"]')||document.getElementById('sectionNav');
      if(target)target.focus();
      return;
    }
    if(review&&review.checked)return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if(status)status.textContent='Review the final plan preview and confirm it before export.';
    if(review)review.focus();
  }
  function invalidate(event){
    if(!review||event.target===review||!review.checked)return;
    if(event.target&&event.target.closest&&event.target.closest('.bp-app')){
      review.checked=false;
      if(status)status.textContent='Plan changed. Review the final preview again before export.';
    }
  }
  function labelFinancialControls(){
    document.querySelectorAll('[data-fin-row]').forEach(function(input){
      if(input.getAttribute('aria-label'))return;
      input.setAttribute('aria-label',input.getAttribute('data-fin-row')+' year '+(Number(input.getAttribute('data-fin-year'))+1));
    });
  }
  document.addEventListener('click',requireReview,true);
  document.addEventListener('input',invalidate,true);
  document.addEventListener('change',invalidate,true);
  document.addEventListener('click',function(event){
    labelFinancialControls();
    if(!review||!review.checked||!event.target||!event.target.closest)return;
    var mutation=event.target.closest('[data-template],[data-open-saved]');
    if(!mutation)return;
    setTimeout(function(){
      review.checked=false;
      if(status)status.textContent='Plan changed. Review the final preview again before export.';
    },0);
  },true);
  if(window.MutationObserver)new MutationObserver(labelFinancialControls).observe(document.getElementById('sectionBody'),{childList:true,subtree:true});
  labelFinancialControls();
})();
</script>
