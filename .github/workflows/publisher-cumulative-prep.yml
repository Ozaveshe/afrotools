{
  "name": "AfroTools cumulative hosted preparation",
  "on": {
    "create": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "prepare": {
      "if": "github.repository == 'Ozaveshe/afrotools' && github.event.ref_type == 'branch' && github.event.ref == 'automation/daily-5pm-publish-deploy-gate-20261111-cumulative-hosted-reviewed-formula'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "env": {
        "CONTEXT": "local",
        "NETLIFY": "false",
        "COMMIT_REF": "${{ github.sha }}"
      },
      "steps": [
        {
          "name": "Checkout exact preparation commit",
          "uses": "actions/checkout@v5",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Require build storage",
          "run": "available=$(df -PB1 \"$GITHUB_WORKSPACE\" | awk 'NR == 2 {print $4}')\nminimum=27917287424\nprintf 'Build filesystem available_bytes=%s minimum_bytes=%s\\n' \"$available\" \"$minimum\"\n[[ \"$available\" =~ ^[0-9]+$ ]] && (( available >= minimum ))"
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Install dependencies",
          "run": "npm ci"
        },
        {
          "name": "Freshness and current claims preflight",
          "run": "npm run data:fallbacks:check\nnode scripts/build-public-claims.js --check"
        },
        {
          "name": "Targeted source tests",
          "run": "git diff --name-only -z HEAD^ HEAD -- tests/ | xargs -0 -r node --test\nnpm run audit:scholarship-truth\nnode scripts/evaluate-ai-tool-call-corpus.js\nnode --test tests/calculation-quality.test.js"
        },
        {
          "name": "Generate changed fuel surfaces",
          "run": "node scripts/generate-fuel-tracker-country-pages.js"
        },
        {
          "name": "Build deploy artifact",
          "run": "npm run build:deploy"
        },
        {
          "name": "Combined checks and security",
          "run": "npm run build:checks\nnpm run security:scan\nnpm run audit:dist\nnode -e 'const f=require(\"node:fs\"); for (const p of [\".git\",\".github\",\".codex\",\".agents\",\"node_modules\",\"netlify\",\"scripts\",\"supabase\",\"tests\",\"docs\",\"reports\",\"audit-results\",\"artifacts\",\"test-results\",\"package.json\",\"package-lock.json\",\"AGENTS.md\",\".env\",\"data/registry\",\"data/automation\",\"data/image-generation\"]) if(f.existsSync(\"dist/\"+p)) throw Error(p)'"
        },
        {
          "name": "Capture generated path inventory",
          "if": "always()",
          "run": "out=\"$RUNNER_TEMP/preparation-inventory\"\nmkdir -p \"$out\"\ngit rev-parse HEAD HEAD^{tree} > \"$out/identity.txt\"\ngit diff --name-status HEAD > \"$out/changed-files.txt\"\ngit ls-files --others --exclude-standard > \"$out/untracked-paths.txt\""
        },
        {
          "name": "Upload preparation path inventory",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "cumulative-paths-${{ github.sha }}",
            "path": "${{ runner.temp }}/preparation-inventory",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        },
        {
          "run": "npm run government:sources:check",
          "name": "Verify government source ledger"
        },
        {
          "run": "out=\"$RUNNER_TEMP/cumulative-preparation\"\nmkdir -p \"$out\"\ngit diff --check HEAD\ngit diff --name-status HEAD > \"$out/tracked-status.txt\"\ngit ls-files --others --exclude-standard > \"$out/untracked-paths.txt\"\ndiff -u .github/publisher-prep/approved-tracked-status.txt \"$out/tracked-status.txt\"\ndiff -u .github/publisher-prep/approved-untracked-paths.txt \"$out/untracked-paths.txt\"\nold=assets/js/bundles/core.1254bf4a.min.js\nnew=assets/js/bundles/core.25fd2009.min.js\ntest ! -e \"$old\"\ntest -f \"$new\"\ntest ! -L \"$new\"\nif git grep -l -F \"core.1254bf4a.min.js\" -- '*.html' assets/js/bundles/manifest.json; then exit 1; fi\ngit diff --binary --full-index HEAD -- . | gzip -n > \"$out/generated.patch.gz\"\ncp \"$new\" \"$out/core.25fd2009.min.js\"\ntest \"$(wc -c < \"$out/generated.patch.gz\")\" -le 16777216\ngit rev-parse HEAD HEAD^{tree} > \"$out/identity.txt\"\n(cd \"$out\" && sha256sum identity.txt tracked-status.txt untracked-paths.txt generated.patch.gz core.25fd2009.min.js > SHA256SUMS)",
          "name": "Export reviewed generated patch and replacement bundle"
        },
        {
          "name": "Upload reviewed cumulative output",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "cumulative-generated-${{ github.sha }}",
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/cumulative-preparation",
            "retention-days": 3
          }
        }
      ]
    }
  }
}
