name: CI - Verify AfroTools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Preservation tests compare current records with pinned release baselines.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser-backed tests
        run: npx playwright install chromium --with-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Verify calculation formulas and jurisdictional data
        run: npm run calculation-quality:check

      - name: Verify static data fallback freshness
        run: npm run data:fallbacks:check

      - name: AI contract tests
        run: npm run test:ai

      - name: Unit and integration tests
        run: npm test

      - name: Verify private command-centre contracts
        run: node --test tests/operator-dashboard-auth.test.mjs tests/operator-engine.test.mjs

      - name: Verify Pro architecture
        run: npm run pro:verify

      - name: Validate i18n dictionaries
        run: npm run build:i18n:validate

      - name: Validate hreflang graph
        run: npm run validate:hreflang

  build:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build deploy artifact
        run: npm run build:deploy

      - name: Audit deploy artifact
        run: npm run audit:dist

      - name: Verify French document artwork and breadcrumbs in the artifact
        run: node scripts/check-french-document-seo.js --dist

      - name: Security scan publish surfaces
        run: npm run security:scan

      - name: Install Chromium for optimized artifact checks
        run: npx playwright install chromium --with-deps

      - name: Verify education journeys and shared accessibility in the optimized artifact
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4175'
        run: npx playwright test tests/e2e/education-workspace.spec.js tests/e2e/education-hub-card-reflow.spec.js tests/e2e/student-day.spec.js tests/e2e/education-applications.spec.js tests/e2e/ssce-practice.spec.js tests/e2e/ssce-written.spec.js tests/e2e/jamb-recent-written.spec.js tests/e2e/jamb-recent-quiz.spec.js tests/e2e/ssce-practice-fr.spec.js tests/e2e/jamb-review-reflow.spec.js tests/e2e/shared-contrast-and-pro-gate.spec.js --project=chromium --workers=2

      - name: Verify Solar startup and French country continuations in the optimized artifact
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4178'
        run: npx playwright test tests/e2e/french-solar-country-initialization.spec.js tests/e2e/french-solar-country-routing.spec.js --project=chromium --workers=2

      - name: Verify Profit Margin validation and exports in the optimized artifact
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4179'
        run: npx playwright test tests/e2e/profit-margin-vip.spec.js tests/e2e/profit-margin-validation.spec.js --grep-invert "durable visual proof" --project=chromium --workers=2 --trace=off

      - name: Verify reconciled completion workflows in the optimized artifact
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4182'
        run: npx playwright test tests/e2e/inventory-vip.spec.js tests/e2e/inventory-pdf-completeness.spec.js tests/e2e/inventory-validation-locales.spec.js tests/e2e/business-name-workshop-vip.spec.js tests/e2e/business-name-saved-exports.spec.js tests/e2e/business-plan-draft-vip.spec.js tests/e2e/business-plan-recovery.spec.js tests/e2e/business-plan-feedback.spec.js tests/e2e/business-plan-export-locales.spec.js tests/e2e/job-offer-evaluator-vip.spec.js tests/e2e/job-offer-csv-safety.spec.js tests/e2e/job-offer-pdf-layout.spec.js tests/e2e/job-offer-feedback.spec.js tests/e2e/market-stall-recovery.spec.js tests/e2e/market-stall-profit-vip.spec.js tests/e2e/market-stall-validation.spec.js tests/e2e/market-stall-restore.spec.js tests/e2e/startup-valuation-recovery.spec.js tests/e2e/startup-valuation-vip.spec.js tests/e2e/startup-valuation-pdf.spec.js tests/e2e/startup-valuation-export-locales.spec.js tests/e2e/startup-valuation-validation.spec.js tests/e2e/idea-evidence-recovery.spec.js tests/e2e/idea-evidence-explorer-vip.spec.js tests/e2e/idea-evidence-locales.spec.js tests/e2e/idea-evidence-origin.spec.js tests/e2e/etims-checklist-recovery.spec.js tests/e2e/sw-etims-guide-final.spec.js tests/e2e/cover-letter-recovery.spec.js tests/e2e/pdf-convert-readiness.spec.js --grep-invert "durable visual proof" --project=chromium --workers=2 --trace=off

      - name: Verify telecom recovery and original locale workflows in the optimized artifact
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4199'
        run: npx playwright test tests/e2e/telecom-recovery.spec.js tests/e2e/french-telecom-parity.spec.js tests/e2e/swahili-telecom-parity.spec.js tests/e2e/day11-telecom-energy-workflows.spec.js --grep-invert "loads every Day 11 canonical route|executes every canonical owner" --project=chromium --workers=2 --retries=0 --trace=off

      - name: Verify guest copy recovery and Business Planner PDF exports
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4197'
        run: npx playwright test tests/e2e/guest-copy-recovery.spec.js tests/e2e/business-guest-pdf-recovery.spec.js --project=chromium --workers=2 --trace=off

      - name: Verify localized enquiry and business actions in the optimized artifact
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4183'
        run: npx playwright test tests/e2e/localized-enquiry-context.spec.js tests/e2e/business-cta-locales.spec.js tests/e2e/hausa-naira-words-parity.spec.js --project=chromium --workers=2 --trace=off

      - name: Verify undecided consent controls at increased zoom
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          PORT: '4184'
        run: npx playwright test tests/e2e/analytics-consent-zoom.spec.js --project=chromium --workers=2 --trace=off

      - name: Verify shared saved-work recovery with optimized scripts
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4185'
        run: npx playwright test tests/e2e/east-africa-paye-restore-recovery.spec.js tests/e2e/ghana-paye-private-ai-boundary.spec.js tests/e2e/ghana-paye-private-sharing.spec.js tests/e2e/ghana-paye-restore-recovery.spec.js tests/e2e/kenya-paye-restore-recovery.spec.js tests/e2e/nigeria-paye-restore-recovery.spec.js tests/e2e/nigeria-paye-saved-settings.spec.js tests/e2e/paye-legacy-storage-recovery.spec.js tests/e2e/paye-sync-real-routes.spec.js tests/e2e/paye-sync-storage-contract.spec.js tests/e2e/pdf-workspace-history-recovery.spec.js tests/e2e/pdf-workspace-history-startup.spec.js tests/e2e/shared-save-state-consumers.spec.js tests/e2e/shared-save-state-documents.spec.js tests/e2e/shared-save-state-freelance.spec.js tests/e2e/shared-save-state-invoice.spec.js tests/e2e/shared-save-state-landing-locales.spec.js tests/e2e/south-africa-paye-restore-recovery.spec.js tests/e2e/sw-paye-storage-recovery.spec.js --project=chromium --workers=2 --trace=off

      - name: Verify French canonical calculator routes in the artifact
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4188'
        run: npx playwright test tests/e2e/french-canonical-routes.spec.js --project=chromium --workers=2 --trace=off

      - name: Verify PDF Workspace startup and original guest exports
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          AFROTOOLS_FR_CURRENT_VERIFICATION: '1'
          PORT: '4189'
        run: |
          npx playwright test tests/e2e/pdf-workspace-startup.spec.js --project=chromium --workers=2 --trace=off
          SW_EXPORT_ID=pdf-workspace npx playwright test tests/e2e/swahili-document-pdf-legacy-export-route.spec.js --project=chromium --workers=1 --trace=off

      - name: Verify document WASM exports under page and worker CSP
        env:
          AFROTOOLS_TEST_PUBLISH_ARTIFACT: '1'
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          AFROTOOLS_TEST_SECURITY_HEADERS: '1'
          AFROTOOLS_FR_CURRENT_VERIFICATION: '1'
          PORT: '4186'
        run: |
          npx playwright test tests/e2e/document-wasm-policy.spec.js --project=chromium --workers=2 --trace=off
          for route in pdf-convert pdf-workflow pdf-ocr; do
            SW_EXPORT_ID="$route" npx playwright test tests/e2e/swahili-document-pdf-legacy-export-route.spec.js --project=chromium --workers=1 --trace=off
          done

      - name: Verify generated outputs are committed
        run: |
          git diff --stat
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Generated files are out of date. Run 'npm run build:deploy' and commit source outputs."
            git diff --name-only
            exit 1
          fi

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke specs
        run: npx playwright test tests/e2e/automation-smoke.spec.js tests/e2e/tool-discovery.spec.js tests/e2e/amount-words-readiness.spec.js tests/e2e/mobile-money-readiness.spec.js tests/e2e/education-hub-card-reflow.spec.js tests/e2e/jamb-review-reflow.spec.js tests/e2e/shared-contrast-and-pro-gate.spec.js tests/e2e/blog-reading-layout.spec.js --project=chromium --workers=1

      - name: Verify AfroJAMB reviewed-content journeys
        env:
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
        run: npx playwright test tests/e2e/jamb-browser-trust.spec.js tests/e2e/jamb-planning-trust.spec.js tests/e2e/jamb-tutor-consent.spec.js tests/e2e/jamb-reviewed-pages.spec.js tests/e2e/jamb-public-review.spec.js --project=chromium --workers=2

      - name: Verify Solar startup and French country continuations
        env:
          AFROTOOLS_TEST_DISABLE_ANALYTICS: '1'
          PORT: '4177'
        run: npx playwright test tests/e2e/french-solar-country-initialization.spec.js tests/e2e/french-solar-country-routing.spec.js --project=chromium --workers=2
