name: CI - Hosted generation preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-generation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Generate reviewable source outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RETURN_DIR: /tmp/generated-return
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install native dependencies
        run: npm ci
      - name: Install native Chromium for existing consent checks
        run: npx playwright install chromium --with-deps
      - name: Verify exact source identity and product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cc8bf054f500b115a6ec12ebfbca2472b0413b8e"
          git switch -C main
          mkdir -p .netlify "$RETURN_DIR"
          printf '%s\n' '{"siteId":"8aa543db-b4bd-4631-98f8-221440055c41"}' > .netlify/state.json
          node scripts/verify-deploy-channel.js --allow-dirty
          node scripts/verify-supabase-consolidation.js
          npm run data:fallbacks:check
          node --test tests/localized-fuel-directory.test.js
          node tests/french-directory-search.test.js
          npm run test:privacy-ai-consent
      - name: Regenerate invoice projections with existing scoped owners
        run: |
          set -euo pipefail
          node scripts/build-sw-all-tools-catalog.js
          node scripts/build-sw-all-tools-catalog.js --check
          node scripts/minify.js --only=assets/js/pages/src/invoice-generator-enhancements.js
          node scripts/build-french-document-pdf-lexicon.js --write
          node scripts/build-swahili-document-pdf-lexicon.js --write
          node scripts/build-french-document-pdf-parity.js --write --app=invoice-generator
          node scripts/build-swahili-document-pdf-parity.js --write --apps=invoice-generator
      - name: Run unchanged native full generation
        run: npm run build:deploy
      - name: Validate generated source and publish surfaces
        run: |
          set -euo pipefail
          npm run build:checks
          npm run security:scan
          npm run audit:dist
          git diff --check
          python - <<'PY'
          import json,os,pathlib
          roots=['.git','.netlify','.github','.codex','.agents','.claude','node_modules','netlify','scripts','supabase','tests','docs','ops','reports','audit-results','artifacts','test-results','package.json','package-lock.json','AGENTS.md','.env','data/registry','data/automation','data/image-generation']
          found=[p for p in roots if (pathlib.Path('dist')/p).exists()]+[str(p) for p in pathlib.Path('dist').glob('.env.*')]
          (pathlib.Path(os.environ['RETURN_DIR'])/'direct-dist-inspection.json').write_text(json.dumps(dict(forbidden_roots=roots,found=found,passed=not found),indent=2)+'\n')
          assert not found,found
          PY
      - name: Capture bounded generated patch with original preimages
        if: ${{ always() }}
        run: python .github/release-preparation/20261120-invoice-lobola-01a1f6a0/collect.py
      - name: Return generated patch and native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated-return/
          if-no-files-found: warn
          retention-days: 14
