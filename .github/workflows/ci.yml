name: CI - Financial hosted generation preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-generation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Generate reviewable financial outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RETURN_DIR: /tmp/generated-return
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install native dependencies
        run: npm ci
      - name: Install native Chromium for consent and browser contracts
        run: npx playwright install chromium --with-deps
      - name: Verify exact source and project
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "60828812e4f3bbd6e8f2f5ff7d5c3fc096162356"
          git switch -C main
          mkdir -p .netlify "$RETURN_DIR"
          printf '%s\n' '{"siteId":"8aa543db-b4bd-4631-98f8-221440055c41"}' > .netlify/state.json
          node scripts/verify-deploy-channel.js --allow-dirty
          node scripts/verify-supabase-consolidation.js
          npm run data:fallbacks:check
          node tests/zambia-paye-period-contract.test.js
          node tests/zambia-paye-2026-parity.test.js
          node tests/swahili-paye-26-parity.test.js
          node tests/swahili-paye-report-language.test.js
          node tests/swahili-paye-local-exports.test.js
          npm run test:privacy-ai-consent
      - name: Materialize owned citation outputs from maintained JSON and evidence owners
        run: |
          set -euo pipefail
          node .github/release-preparation/20261121-financial-0214-01a1f9d0/generate-financial.cjs
          node scripts/build-sw-financial-shard-b-evidence.js --write
          node scripts/upgrade-mixed-education-trust-batch.js ha/kayan-aiki/kasafin-dalibi/index.html
          node .github/release-preparation/20261121-financial-0214-01a1f9d0/generate-financial.cjs --check
          node tests/swahili-financial-shard-b.test.js
      - name: Run unchanged native full generation
        run: npm run build:deploy
      - name: Validate generated source and publish surfaces
        run: |
          set -euo pipefail
          node .github/release-preparation/20261121-financial-0214-01a1f9d0/generate-financial.cjs --check
          node tests/zambia-paye-period-contract.test.js
          node tests/zambia-paye-2026-parity.test.js
          node tests/swahili-paye-26-parity.test.js
          node tests/swahili-paye-report-language.test.js
          node tests/swahili-paye-local-exports.test.js
          node tests/swahili-financial-shard-b.test.js
          npm run build:checks
          npm run security:scan
          npm run audit:dist
          git diff --check
          python - <<'PY'
          import json,os,pathlib
          roots=['.git','.netlify','.github','.codex','.agents','.claude','node_modules','netlify','scripts','supabase','tests','docs','ops','reports','audit-results','artifacts','test-results','package.json','package-lock.json','AGENTS.md','.env','data/registry','data/automation','data/image-generation']
          found=[p for p in roots if (pathlib.Path('dist')/p).exists()]+[str(p) for p in pathlib.Path('dist').glob('.env.*')]
          (pathlib.Path(os.environ['RETURN_DIR'])/'direct-dist-inspection.json').write_text(json.dumps({'forbidden_roots':roots,'found':found,'passed':not found},indent=2)+'\n')
          assert not found,found
          PY
      - name: Capture bounded generated patch with original preimages
        if: ${{ always() }}
        run: python .github/release-preparation/20261121-financial-0214-01a1f9d0/collect.py
      - name: Require all returned evidence files
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -s "$RETURN_DIR/generated.patch"
          test -s "$RETURN_DIR/manifest.json"
          test -s "$RETURN_DIR/direct-dist-inspection.json"
          test -s "$RETURN_DIR/citation-materialization.json"
          python - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['RETURN_DIR'])
          for name in ['generated.patch','manifest.json','direct-dist-inspection.json','citation-materialization.json']:
              file=root/name
              assert file.is_file() and not file.is_symlink() and file.stat().st_size>0,name
          PY
      - name: Return generated patch and native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RETURN_DIR }}/
          if-no-files-found: error
          retention-days: 14
