{
  "name": "AfroTools hosted redirect preparation",
  "on": {
    "create": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "prepare": {
      "if": "github.repository == 'Ozaveshe/afrotools' && github.event.ref_type == 'branch' && github.event.ref == 'automation/daily-5pm-publish-deploy-gate-20261111-hosted-redirect-claims-complete-export'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 75,
      "env": {
        "CONTEXT": "local",
        "NETLIFY": "false",
        "COMMIT_REF": "${{ github.sha }}"
      },
      "steps": [
        {
          "name": "Check out preparation commit",
          "uses": "actions/checkout@v5",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Require build storage",
          "shell": "bash",
          "run": "available=$(df -PB1 \"$GITHUB_WORKSPACE\" | awk 'NR == 2 {print $4}')\nminimum=27917287424\nprintf 'Build filesystem available_bytes=%s minimum_bytes=%s\\n' \"$available\" \"$minimum\"\n[[ \"$available\" =~ ^[0-9]+$ ]] && (( available >= minimum ))"
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Install dependencies",
          "run": "npm ci"
        },
        {
          "name": "Check fallback freshness and targeted routes",
          "run": "npm run data:fallbacks:check\nnode --test tests/route-fallback.test.mjs\ngit diff --check"
        },
        {
          "name": "Build and audit the deploy artifact",
          "run": "npm run build:deploy\nnpm run build:checks\nnpm run security:scan\nnpm run audit:dist\nnode -e 'const f=require(\"node:fs\"); for (const p of [\".git\",\".github\",\".codex\",\".agents\",\"node_modules\",\"netlify\",\"scripts\",\"supabase\",\"tests\",\"docs\",\"reports\",\"audit-results\",\"artifacts\",\"test-results\",\"package.json\",\"package-lock.json\",\"AGENTS.md\",\".env\",\"data/registry\",\"data/automation\",\"data/image-generation\"]) if(f.existsSync(\"dist/\"+p)) throw Error(p)'"
        },
        {
          "name": "Export eight approved generated postimages",
          "run": "out=\"$RUNNER_TEMP/publisher-prep\"\nmkdir -p \"$out\"\ngit diff --check HEAD\ngit diff --name-status HEAD > \"$out/changed-files.txt\"\ngit ls-files --others --exclude-standard > \"$out/untracked-paths.txt\"\ntest ! -s \"$out/untracked-paths.txt\"\nprintf '%s\\n' _redirects data/registry/route-graph.json reports/public-claims.json reports/public-claims.md reports/route-contract-report.json reports/route-contract-report.md status/index.html status/product-health.json | sort > \"$out/expected-paths.txt\"\nawk -F '\\t' '$1 != \"M\" { exit 1 } {print $2}' \"$out/changed-files.txt\" > \"$out/actual-paths.txt\"\nsort -o \"$out/actual-paths.txt\" \"$out/actual-paths.txt\"\ndiff -u \"$out/expected-paths.txt\" \"$out/actual-paths.txt\"\nwhile IFS= read -r p; do test -f \"$p\" && test ! -L \"$p\" || exit 1; done < \"$out/actual-paths.txt\"\ngit rev-parse HEAD HEAD^{tree} > \"$out/preparation-identity.txt\"\nxargs -d '\\n' sha256sum < \"$out/actual-paths.txt\" > \"$out/postimage-SHA256SUMS\"\ntar -czf \"$out/generated-postimages.tar.gz\" -T \"$out/actual-paths.txt\"\ntest \"$(wc -c < \"$out/generated-postimages.tar.gz\")\" -le 16777216\n(cd \"$out\" && sha256sum generated-postimages.tar.gz postimage-SHA256SUMS changed-files.txt untracked-paths.txt preparation-identity.txt > SHA256SUMS)"
        },
        {
          "name": "Upload small preparation artifact",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "publisher-redirect-prep-${{ github.sha }}",
            "path": "${{ runner.temp }}/publisher-prep",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        }
      ]
    }
  }
}
