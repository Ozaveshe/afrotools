name: Automation Health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-health
  cancel-in-progress: false

jobs:
  check-live-automation-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight monitor configuration
        id: preflight
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          rm -f reports/live-automation-health-latest.json reports/live-automation-health-latest.md
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is not configured. \
          The monitor cannot read live_data_store, so feed freshness is UNKNOWN, not healthy."
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check live automation health
        id: health
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run automation:live-health:strict

      - name: Upload automation health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-health-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            reports/live-automation-health-latest.json
            reports/live-automation-health-latest.md

      - name: Prepare failure alert
        if: steps.preflight.outputs.configured != 'true' || steps.health.outcome == 'failure'
        id: alert
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const reportPath = 'reports/live-automation-health-latest.json';
          const report = fs.existsSync(reportPath)
            ? JSON.parse(fs.readFileSync(reportPath, 'utf8'))
            : null;
          const configured = process.env.MONITOR_CONFIGURED === 'true';
          const counts = report && report.counts ? report.counts : {};
          const stale = Number(counts.stale || 0);
          const missing = Number(counts.missing || 0);
          const failedChecks = report && Array.isArray(report.checks)
            ? report.checks.filter((check) => check.status !== 'ok')
            : [];

          // Three distinct failure modes. Never report "0 stale, 0 missing" for a run
          // that measured nothing -- an unmeasured feed is UNKNOWN, not healthy.
          let title;
          let summary;
          if (!configured) {
            title = 'Automation health: monitor not configured (cannot measure feeds)';
            summary = 'The monitor did not run. Repository secret `SUPABASE_SERVICE_ROLE_KEY` '
              + 'is not set, so `live_data_store` could not be read. Feed freshness is '
              + '**unknown** -- this issue is not evidence that the feeds are healthy, '
              + 'and not evidence that they are stale.';
          } else if (!report) {
            title = 'Automation health: no report produced (monitor crashed)';
            summary = 'The monitor ran but produced no report, so feed freshness is '
              + '**unknown**. Check the workflow logs for a crash in '
              + '`scripts/audit-live-automation-health.js`.';
          } else {
            title = `Automation health: ${stale} stale, ${missing} missing`;
            summary = 'The scheduled automation health gate failed against a real report.';
          }

          const lines = [summary, ''];
          if (configured && report) {
            lines.push(
              `- Generated: ${report.generated_at}`,
              `- Stale: ${stale}`,
              `- Missing: ${missing}`,
              `- Degraded: ${Number(counts.degraded || 0)}`,
              `- Unavailable: ${Number(counts.unavailable || 0)}`,
            );
          } else {
            lines.push('- Stale: unknown', '- Missing: unknown');
          }
          lines.push(`- Workflow run: ${process.env.RUN_URL}`);

          if (failedChecks.length) {
            lines.push('', '### Non-healthy checks', '');
            for (const check of failedChecks) {
              lines.push(
                `- **${check.id}**: ${check.status}; latest=${check.latest_at || 'never'}; ` +
                `SLA=${check.sla_hours || 'n/a'}h; next=${check.next_scheduled_at || 'n/a'}`
              );
            }
          }
          if (!configured) {
            lines.push(
              '',
              '### How to fix',
              '',
              '```',
              'gh secret set SUPABASE_SERVICE_ROLE_KEY --repo ' + process.env.GITHUB_REPOSITORY,
              '```',
              '',
              'The same secret also gates the weekly `Static Data Fallback Refresh PR` workflow.',
            );
          }
          fs.writeFileSync('automation-health-issue.md', `${lines.join('\n')}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          NODE
        env:
          MONITOR_CONFIGURED: ${{ steps.preflight.outputs.configured }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Open or update automation health issue
        if: steps.preflight.outputs.configured != 'true' || steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: ${{ steps.alert.outputs.title }}
        run: |
          issue_number="$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("Automation health:"))][0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "$ALERT_TITLE" --body-file automation-health-issue.md
          else
            gh issue create --title "$ALERT_TITLE" --body-file automation-health-issue.md
          fi

      - name: Close recovered automation health issue
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("Automation health:"))][0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "Automation health recovered in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi

      - name: Fail workflow when health is not green
        if: steps.preflight.outputs.configured != 'true' || steps.health.outcome == 'failure'
        run: exit 1
