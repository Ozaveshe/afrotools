name: Automation Health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-health
  cancel-in-progress: false

jobs:
  check-live-automation-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check live automation health
        id: health
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          rm -f reports/live-automation-health-latest.json reports/live-automation-health-latest.md
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is not configured."
            exit 1
          fi
          npm run automation:live-health:strict

      - name: Check publishing freshness SLO
        id: publishing
        continue-on-error: true
        run: npm run automation:publishing-slo -- --live --write

      - name: Upload automation health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-health-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            reports/live-automation-health-latest.json
            reports/live-automation-health-latest.md
            reports/publishing-slo-latest.json
            reports/publishing-slo-latest.md

      - name: Prepare failure alert
        if: steps.health.outcome == 'failure' || steps.publishing.outcome == 'failure'
        id: alert
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const reportPath = 'reports/live-automation-health-latest.json';
          const report = fs.existsSync(reportPath)
            ? JSON.parse(fs.readFileSync(reportPath, 'utf8'))
            : null;
          const counts = report && report.counts ? report.counts : {};
          const publishingPath = 'reports/publishing-slo-latest.json';
          const publishing = fs.existsSync(publishingPath)
            ? JSON.parse(fs.readFileSync(publishingPath, 'utf8'))
            : null;
          const publishingErrors = publishing && publishing.counts
            ? Number(publishing.counts.errors || 0)
            : (process.env.PUBLISHING_OUTCOME === 'failure' ? 1 : 0);
          const stale = Number(counts.stale || 0);
          const missing = Number(counts.missing || 0);
          const title = `Automation health: ${stale} stale, ${missing} missing, ${publishingErrors} publishing`;
          const failedChecks = report && Array.isArray(report.checks)
            ? report.checks.filter((check) => check.status !== 'ok')
            : [];
          const lines = [
            'The scheduled automation health monitor found non-healthy live proof.',
            '',
            `- Generated: ${report ? report.generated_at : 'no fresh report; check workflow configuration'}`,
            `- Stale: ${stale}`,
            `- Missing: ${missing}`,
            `- Pending first run: ${Number(counts.pending || 0)}`,
            `- Degraded: ${Number(counts.degraded || 0)}`,
            `- Unavailable: ${Number(counts.unavailable || 0)}`,
            `- Publishing SLO errors: ${publishingErrors}`,
            `- Latest source article: ${publishing && publishing.source && publishing.source.latest ? publishing.source.latest.slug : 'unavailable'}`,
            `- Source articles dated today: ${publishing && publishing.source ? publishing.source.today_count : 'unavailable'}`,
            `- Workflow run: ${process.env.RUN_URL}`,
          ];
          if (failedChecks.length) {
            lines.push('', '### Non-healthy checks', '');
            for (const check of failedChecks) {
              lines.push(
                `- **${check.id}**: ${check.status}; latest=${check.latest_at || 'never'}; ` +
                `SLA=${check.sla_hours || 'n/a'}h; next=${check.next_scheduled_at || 'n/a'}`
              );
            }
          } else if (!report) {
            lines.push('', 'No fresh report was produced. Verify the Actions secret and workflow logs.');
          }
          if (publishing && Array.isArray(publishing.issues) && publishing.issues.length) {
            lines.push('', '### Publishing SLO issues', '');
            for (const issue of publishing.issues) {
              lines.push(`- **${issue.code}**: ${issue.detail}`);
            }
          }
          fs.writeFileSync('automation-health-issue.md', `${lines.join('\n')}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          NODE
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISHING_OUTCOME: ${{ steps.publishing.outcome }}

      - name: Open or update automation health issue
        if: steps.health.outcome == 'failure' || steps.publishing.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: ${{ steps.alert.outputs.title }}
        run: |
          issue_number="$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("Automation health:"))][0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "$ALERT_TITLE" --body-file automation-health-issue.md
          else
            gh issue create --title "$ALERT_TITLE" --body-file automation-health-issue.md
          fi

      - name: Close recovered automation health issue
        if: steps.health.outcome == 'success' && steps.publishing.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("Automation health:"))][0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "Automation health recovered in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi

      - name: Keep manually requested health gates strict
        if: steps.health.outcome == 'failure' && github.event_name == 'workflow_dispatch'
        run: exit 1

      - name: Keep manually requested publishing gates strict
        if: steps.publishing.outcome == 'failure' && github.event_name == 'workflow_dispatch'
        run: exit 1
