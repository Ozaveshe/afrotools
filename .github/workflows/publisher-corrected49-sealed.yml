{
  "name": "Publisher corrected49 sealed affected-browser proof",
  "on": {
    "create": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "selected": {
      "if": "github.event.ref_type == 'branch' && github.event.ref == 'automation/publisher-safe49-sealed-39896563071-01a15fbb'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Read operator proof harness",
          "uses": "actions/checkout@v5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Preserve harness outside candidate source",
          "run": "mkdir -p \"$RUNNER_TEMP/publisher-selected-proof\"\ncp .github/publisher-selected-proof/* \"$RUNNER_TEMP/publisher-selected-proof/\""
        },
        {
          "name": "Checkout exact original release candidate",
          "uses": "actions/checkout@v5",
          "with": {
            "ref": "67b74f5a30dbc3c9bb639d7b080365990f30b98a",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": "22",
            "cache": "npm"
          }
        },
        {
          "name": "Set up Python for strict archive and selected closure checks",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install dependencies",
          "run": "npm ci"
        },
        {
          "name": "Verify complete seven affected specs against the exact original sealed artifact",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "node \"$RUNNER_TEMP/publisher-selected-proof/wrapper.cjs\""
        },
        {
          "name": "Preserve exact proof and all raw failures",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "safe49-sealed-proof-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/publisher-selected-proof/summary.json\n${{ runner.temp }}/publisher-selected-proof/failure.json\n${{ runner.temp }}/publisher-selected-proof/zip-proof.json\n${{ runner.temp }}/publisher-selected-proof/manifest.json\n${{ runner.temp }}/publisher-selected-proof/input.json\n${{ runner.temp }}/publisher-selected-proof/source-list.json\n${{ runner.temp }}/publisher-selected-proof/source-list.stderr.log\n${{ runner.temp }}/publisher-selected-proof/source-browser.report.json\n${{ runner.temp }}/publisher-selected-proof/source-browser.stderr.log\n${{ runner.temp }}/publisher-selected-proof/browser.report.json\n${{ runner.temp }}/publisher-selected-proof/browser.stderr.log\n${{ runner.temp }}/publisher-selected-proof/direct-dist-inspection.json\n${{ runner.temp }}/publisher-selected-proof/audit-dist.stdout.log\n${{ runner.temp }}/publisher-selected-proof/audit-dist.stderr.log\n${{ runner.temp }}/publisher-selected-proof/hosted-sealed-candidate/\n${{ runner.temp }}/publisher-selected-proof/hosted-sealed-candidate-browser-output/\n${{ runner.temp }}/publisher-selected-proof/changed-source-browser-output/\n${{ runner.temp }}/publisher-selected-proof/wrapper-result.json\n${{ runner.temp }}/publisher-selected-proof/ui-closure-export-summary.json\n${{ runner.temp }}/publisher-selected-proof/hosted-ui-summary.json\n${{ runner.temp }}/publisher-selected-proof/hosted-ui-failure.json\n${{ runner.temp }}/publisher-selected-proof/hosted-ui/\n!${{ runner.temp }}/publisher-selected-proof/hosted-ui/profile/**\n${{ runner.temp }}/publisher-selected-proof/native-group-1.json\n${{ runner.temp }}/publisher-selected-proof/native-group-2.json\n${{ runner.temp }}/publisher-selected-proof/native-groups-export-summary.json\n${{ runner.temp }}/publisher-selected-proof/native-groups-export-failure.json",
            "if-no-files-found": "warn"
          }
        }
      ],
      "container": {
        "image": "mcr.microsoft.com/playwright@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53",
        "options": "--ipc=host"
      }
    }
  }
}