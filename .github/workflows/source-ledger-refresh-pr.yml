name: Source Ledger Refresh PR

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-source-ledgers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh government source ledger
        run: npm run government:sources

      - name: Refresh transport source ledger
        run: npm run transport:sources

      - name: Detect source ledger changes
        id: changes
        shell: bash
        run: |
          git status --short \
            data/government/source-status.json \
            data/transport/source-status.json \
            reports/government-source-ledger.md \
            reports/transport-source-ledger.md \
            government/index.html \
            transport/index.html
          if [ -n "$(git status --short data/government/source-status.json data/transport/source-status.json reports/government-source-ledger.md reports/transport-source-ledger.md government/index.html transport/index.html)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --patch -- \
              data/government/source-status.json \
              data/transport/source-status.json \
              reports/government-source-ledger.md \
              reports/transport-source-ledger.md \
              government/index.html \
              transport/index.html > "$RUNNER_TEMP/source-ledger-refresh.patch"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload source ledger refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-ledger-refresh-evidence
          if-no-files-found: ignore
          path: |
            data/government/source-status.json
            data/transport/source-status.json
            reports/government-source-ledger.md
            reports/transport-source-ledger.md
            ${{ runner.temp }}/source-ledger-refresh.patch

      - name: Open source ledger refresh PR
        id: cpr
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/source-ledger-refresh
          delete-branch: true
          title: "chore: refresh government and transport source ledgers"
          commit-message: "chore: refresh government and transport source ledgers"
          body: |
            Weekly official-source ledger refresh.

            This PR updates generated source status, reports, and hub source-summary timestamps for government and transport ledgers. Changed hashes are review signals only. Review blocked, broken, manual-review, or changed rows before updating public fees, eligibility, documents, timelines, duties, tariffs, fares, or rates.

      # PR creation needs Settings -> Actions -> General -> "Allow GitHub Actions to
      # create and approve pull requests". Without it the refresh still succeeds and
      # the branch is still pushed, so surface the compare link rather than going red
      # every Monday over a repository setting.
      - name: Report refresh outcome
        if: always() && steps.changes.outputs.changed == 'true'
        env:
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...automation/source-ledger-refresh?expand=1
        run: |
          {
            if [ "${{ steps.cpr.outcome }}" = "success" ]; then
              echo "## Source ledger refresh"
              echo
              echo "Pull request: ${{ steps.cpr.outputs.pull-request-url }}"
            else
              echo "## Source ledger refresh - branch pushed, PR not opened"
              echo
              echo "The ledgers refreshed successfully and \`automation/source-ledger-refresh\` was pushed,"
              echo "but this repository does not permit GitHub Actions to create pull requests."
              echo
              echo "Open it manually: $COMPARE_URL"
              echo
              echo "To automate this, enable **Settings -> Actions -> General -> Workflow permissions ->"
              echo "Allow GitHub Actions to create and approve pull requests**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report no-op refresh
        if: steps.changes.outputs.changed != 'true'
        run: echo "No source ledger changes this week." >> "$GITHUB_STEP_SUMMARY"
