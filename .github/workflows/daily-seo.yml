name: Daily SEO Auto-fix

on:
  schedule:
    # Runs every day at 02:00 UTC (before Netlify's daily crawl window)
    - cron: '0 2 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Use the default token — write permission granted above
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history so git push works cleanly
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check pause switch
        id: maintenance
        run: |
          if [ "${{ vars.AFROTOOLS_DAILY_MAINTENANCE_PAUSED }}" = "1" ] || [ "${{ secrets.AFROTOOLS_DAILY_MAINTENANCE_PAUSED }}" = "1" ]; then
            echo "Daily maintenance paused by AFROTOOLS_DAILY_MAINTENANCE_PAUSED."
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run SEO daily fix
        id: seo
        if: steps.maintenance.outputs.paused != 'true'
        # Preserve source-backed lastmod values. Broad daily restamps make the
        # committed sitemap index diverge from the deterministic site build.
        run: node scripts/seo-daily-fix.js

      - name: Verify SEO fixes
        if: steps.maintenance.outputs.paused != 'true'
        run: |
          npm run test:seo-preferred-url
          npm run validate:hreflang
          npm run seo:report

      - name: Open a pull request for any fixes
        if: steps.maintenance.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "AfroTools SEO Bot"
          git config user.email "seo-bot@afrotools.com"

          git add \
            sitemap.xml \
            sitemap-i18n.xml \
            robots.txt \
            _redirects \
            $(git diff --name-only -- '*.html' 2>/dev/null || true)

          # Only commit if there are staged changes
          if git diff --staged --quiet; then
            echo "No SEO changes today — site is clean."
          else
            branch="automation/daily-seo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch"
            git commit -m "chore(seo): daily auto-fix $(date -u +%Y-%m-%d)"
            git push --set-upstream origin "$branch"
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(seo): daily auto-fix $(date -u +%Y-%m-%d)" \
              --body "Automated SEO maintenance changes. Validation completed before this PR was opened: preferred-route regression coverage, hreflang validation, and the SEO report."
            echo "SEO fixes pushed to a reviewable pull request."
          fi
