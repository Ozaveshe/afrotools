{
  "name": "AfroTools planning POS Airtel preparation",
  "on": {
    "create": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "prepare": {
      "if": "github.repository == 'Ozaveshe/afrotools' && github.event.ref_type == 'branch' && github.event.ref == 'codex/publisher-planning-pos-airtel-20261113-a2'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 100,
      "env": {
        "CONTEXT": "local",
        "NETLIFY": "false",
        "COMMIT_REF": "${{ github.sha }}"
      },
      "steps": [
        {
          "name": "Checkout exact preparation commit",
          "uses": "actions/checkout@v5",
          "with": {
            "ref": "${{ github.ref }}",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Require build storage",
          "run": "available=$(df -PB1 \"$GITHUB_WORKSPACE\" | awk 'NR == 2 {print $4}')\nminimum=27917287424\nprintf 'Build filesystem available_bytes=%s minimum_bytes=%s\\n' \"$available\" \"$minimum\"\n[[ \"$available\" =~ ^[0-9]+$ ]] && (( available >= minimum ))"
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Install dependencies",
          "run": "npm ci"
        },
        {
          "name": "Freshness and calculation inventory preflight",
          "run": "npm run data:fallbacks:check\nnpm run calculation-quality:check\nnpm run test:calculation-quality"
        },
        {
          "name": "Targeted source tests",
          "run": "node --test tests/pos-agent-operating-break-even.test.js tests/airtel-kenya-tariff-boundaries.test.js tests/ai-intent-router.test.js tests/ai-orchestrator.test.js tests/fr-small-business-engine-parity.test.js tests/sw-small-business-engine-parity.test.js tests/mobile-money-quote-engine.test.js tests/mobile-money-tariff-source-review.test.js tests/mobile-money-fee-finder.test.js tests/domestic-worker-ai-contract.test.js tests/maternity-leave-ai-contract.test.js tests/day7-work-permit-cost.test.js tests/day7-work-permit-family-contract.test.js tests/fuel-market-observations.test.js tests/fuel-market-locales.test.js tests/api-fuel-market-references.test.js"
        },
        {
          "name": "Regenerate maintained tool owners",
          "run": "node scripts/build-day7-work-permit-options.js\nnode scripts/build-mobile-money-fee-finder.js --write\nnode tests/day7-work-permit-family-contract.test.js"
        },
        {
          "name": "Build deploy artifact",
          "run": "npm run build:deploy"
        },
        {
          "name": "Combined checks and security",
          "run": "npm run build:checks\nnpm run security:scan\nnpm run audit:dist\nnode --test tests/pos-agent-operating-break-even.test.js tests/airtel-kenya-tariff-boundaries.test.js tests/day7-work-permit-family-contract.test.js tests/mobile-money-runtime-config-sync.test.js\nnode -e 'const f=require(\"node:fs\"); for (const p of [\".git\",\".netlify\",\".github\",\".codex\",\".agents\",\"node_modules\",\"netlify\",\"scripts\",\"supabase\",\"tests\",\"docs\",\"ops\",\"reports\",\"audit-results\",\"artifacts\",\"test-results\",\"package.json\",\"package-lock.json\",\"AGENTS.md\",\".env\",\"data/registry\",\"data/automation\",\"data/image-generation\"]) if(f.existsSync(\"dist/\"+p)) throw Error(p); for(const p of f.readdirSync(\"dist\")) if(p.startsWith(\".env.\")) throw Error(p)'"
        },
        {
          "name": "Capture generated path inventory",
          "if": "always()",
          "run": "out=\"$RUNNER_TEMP/preparation-inventory\"\nmkdir -p \"$out\"\ngit rev-parse HEAD HEAD^{tree} > \"$out/identity.txt\"\ngit diff --name-status HEAD > \"$out/changed-files.txt\"\ngit ls-files --others --exclude-standard > \"$out/untracked-paths.txt\""
        },
        {
          "name": "Upload preparation path inventory",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "cumulative-paths-${{ github.sha }}",
            "path": "${{ runner.temp }}/preparation-inventory",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        },
        {
          "run": "out=\"$RUNNER_TEMP/cumulative-preparation\"\nmkdir -p \"$out\"\ngit diff --check HEAD\ngit diff --name-status --no-renames HEAD > \"$out/tracked-status.txt\"\ngit ls-files --others --exclude-standard > \"$out/untracked-paths.txt\"\ntest ! -s \"$out/untracked-paths.txt\"\nif grep -v -E '^M[[:space:]]' \"$out/tracked-status.txt\"; then exit 1; fi\ngit diff --binary --full-index HEAD -- . | gzip -n > \"$out/generated.patch.gz\"\ntest \"$(wc -c < \"$out/generated.patch.gz\")\" -le 8388608\ngit rev-parse HEAD HEAD^{tree} > \"$out/identity.txt\"\n(cd \"$out\" && sha256sum identity.txt tracked-status.txt untracked-paths.txt generated.patch.gz > SHA256SUMS)",
          "name": "Export bounded generated changes"
        },
        {
          "name": "Upload reviewed cumulative output",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "cumulative-generated-${{ github.sha }}",
            "if-no-files-found": "error",
            "path": "${{ runner.temp }}/cumulative-preparation",
            "retention-days": 3
          }
        },
        {
          "name": "Install Chromium for native browser-backed source tests",
          "run": "npx playwright install chromium --with-deps"
        },
        {
          "name": "Run complete native Verify source gates",
          "run": "npm run lint\nnpm run type-check\nnpm run test:ai\nnpm test"
        }
      ]
    }
  },
  "concurrency": {
    "group": "publisher-planning-pos-airtel-preparation",
    "cancel-in-progress": false
  }
}
