<body class="cht-app top-level-page-ui-refresh">

  <!-- HEADER (Carousel-style) -->
  <header class="cht-app-header">
    <a href="/fr/tools/hashtags-createur/" class="cht-app-logo">
      <span>#</span> TagWave
    </a>
    <div class="cht-header-actions">
      <button type="button" class="cht-btn-icon" id="historyBtn" title="Historique" aria-label="Ouvrir l’historique">&#128197;</button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="cht-workspace">

    <!-- INPUT CARD -->
    <div class="cht-input-card">
      <label class="cht-input-label" for="topicInput">Quel est le sujet de la publication ?</label>
      <textarea class="cht-input-field" id="topicInput" placeholder="Coulisses d’une séance photo de mariage à Dakar…" rows="2"></textarea>

      <label class="cht-input-label" style="margin-top:16px">Plateforme</label>
      <div class="cht-platforms" id="platformPills"></div>
      <label class="cht-input-label" for="generationMode" style="margin-top:16px">Mode de génération</label>
      <select class="cht-input-field" id="generationMode"><option value="local">Local et déterministe (recommandé)</option><option value="ai">Assistance IA facultative</option></select>
      <label id="aiConsentWrap" class="cht-consent" hidden><input type="checkbox" id="aiConsent"> J’accepte d’envoyer le sujet et la plateforme sélectionnée à AfroTools AI. Le sujet exact ci-dessus quittera ce navigateur.</label>

      <button type="button" class="cht-generate-btn" id="generateBtn" onclick="window._chtGenerate()">
        <span class="cht-spinner"></span>Générer les hashtags &#127991;&#65039;
      </button>
      <div class="cht-loading-status" id="loadingStatus"></div>
    </div>

    <!-- REACH LEGEND -->
    <div class="cht-legend" id="legend" style="display:none">
      <div class="cht-legend-item"><span class="cht-legend-dot high"></span>Portée large</div>
      <div class="cht-legend-item"><span class="cht-legend-dot mid"></span>Mid Reach (100K–1M)</div>
      <div class="cht-legend-item"><span class="cht-legend-dot niche"></span>Niche ciblée</div>
    </div>

    <!-- OUTPUT AREA -->
    <div class="cht-output" id="outputArea" aria-live="polite"></div>
    <div class="cht-mix-actions" id="exportActions" hidden><button type="button" class="cht-action-btn" id="downloadTxt">Télécharger TXT</button><button type="button" class="cht-action-btn" id="downloadJson">Télécharger JSON</button></div>

    <!-- MIX BUILDER (shown after generation) -->
    <div class="cht-mix-card" id="mixCard" style="display:none">
      <div class="cht-mix-header">
        <div class="cht-mix-title">&#128295; COMPOSER VOTRE MÉLANGE</div>
        <div class="cht-mix-count" id="mixCount">0 / 30 maximum</div>
      </div>
      <p style="font-size:13px;color:var(--cht-muted);margin-bottom:12px">Sélectionnez les hashtags ci-dessus pour composer votre mélange.</p>
      <div class="cht-mix-tags" id="mixTags">
        <span class="cht-mix-empty">Sélectionnez des hashtags ci-dessus.</span>
      </div>
      <div class="cht-mix-warn" id="mixWarn">&#9888;&#65039; Vous dépassez le nombre conseillé pour cette plateforme.</div>
      <div class="cht-mix-actions">
        <button type="button" class="cht-action-btn" onclick="window._chtCopyMix()">&#128203; Copier le mélange</button>
        <button type="button" class="cht-action-btn" onclick="window._chtClearMix()">&#128465; Effacer</button>
      </div>
    </div>

  </div>

  <!-- HISTORY PANEL -->
  <div id="historyPanel" class="cht-history-overlay" role="dialog" aria-modal="true" aria-labelledby="historyTitle" style="display:none">
    <div class="cht-history-panel">
      <div class="cht-history-header">
        <h3 id="historyTitle">Historique local</h3>
        <button type="button" class="cht-btn-icon" id="historyClose" aria-label="Fermer l’historique">&times;</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="cht-toast" id="toast"></div>
