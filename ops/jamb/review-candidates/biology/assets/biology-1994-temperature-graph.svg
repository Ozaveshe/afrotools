<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 560" role="img" aria-labelledby="t d"><title id="t">Body and external temperature graph</title><desc id="d">Horizontal axis external temperature in degrees Celsius, vertical axis body temperature in degrees Celsius; both show ticks at 10, 20, 30 and 40. The solid Dog curve starts near 37, rises slightly to about 40 and remains almost horizontal. The dashed Lizard line rises diagonally from the origin toward 40 on both axes.</desc><rect width="650" height="560" fill="white"/>
